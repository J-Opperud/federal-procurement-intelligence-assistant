version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite:////data/scout.db
      - CHROMA_PERSIST_DIRECTORY=/data/chroma  # <--- Forces Chroma into the persistent volume!
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - sqlite_data:/data
      - chromadb:/data/chroma
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: sentinel_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sentinel-frontend
    container_name: sentinel_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
  ollama_data: